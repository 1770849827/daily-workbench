<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#EC407A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="从不入梦来">
    <title>从不入梦来</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 开屏画面 -->
    <div id="splash-screen" style="position:fixed;inset:0;z-index:99999;background-color:#FFE4EC;background-size:cover;background-position:center bottom;background-repeat:no-repeat;"></div>
    <!-- 背景轮播层 -->
    <div id="bg-layer"></div>
    <div id="app">
        <!-- 顶部栏（移动端） -->
        <header class="app-header">
            <button class="menu-toggle" id="menuToggle" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
            <h1 class="app-title" id="pageTitle">生活工作台</h1>
            <button class="sync-btn" id="syncBtn" aria-label="同步" title="云端同步">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
        </header>

        <!-- 左侧导航栏 -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">🌸</div>
                <div class="sidebar-title">生活工作台</div>
            </div>
            <ul class="nav-list" id="navList">
                <li class="nav-item active" data-page="home"><span class="nav-icon">🏠</span><span class="nav-label">首页</span></li>
                <li class="nav-item" data-page="todo"><span class="nav-icon">📋</span><span class="nav-label">每日计划</span></li>
                <li class="nav-item" data-page="english"><span class="nav-icon">🔤</span><span class="nav-label">英语学习</span></li>
                <li class="nav-item" data-page="calligraphy"><span class="nav-icon">✍️</span><span class="nav-label">硬笔练字</span></li>
                <li class="nav-item" data-page="fitness"><span class="nav-icon">💪</span><span class="nav-label">游泳健身</span></li>
                <li class="nav-item" data-page="meal"><span class="nav-icon">🍽️</span><span class="nav-label">饮食记录</span></li>
                <li class="nav-item" data-page="savings"><span class="nav-icon">💰</span><span class="nav-label">存钱计划</span></li>
                <li class="nav-item" data-page="accounting"><span class="nav-icon">📒</span><span class="nav-label">每日记账</span></li>
                <li class="nav-item" data-page="places"><span class="nav-icon">📍</span><span class="nav-label">我的足迹</span></li>
            </ul>
            <div class="sidebar-footer">
                <button class="export-btn" id="exportBtn">📤 导出数据</button>
                <button class="import-btn" id="importBtn">📥 导入数据</button>
                <input type="file" id="importFile" accept=".json" style="display:none">
            </div>
        </nav>

        <!-- 遮罩层 -->
        <div class="overlay" id="overlay"></div>

        <!-- 主内容区 -->
        <main class="main-content" id="mainContent"></main>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 模态框容器 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modalTitle">标题</h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="js/storage.js" defer></script>
    <script src="js/sync.js" defer></script>
    <script src="js/audio-data.js" defer></script>
    <script src="js/background-data.js" defer></script>
    <script src="js/cover-data.js" defer></script>
    <script src="js/splash-data.js" defer></script>
    <!-- 贴纸改为独立PNG文件按需加载（assets/stickers/），不再内联base64 -->
    <script src="js/modules/home.js" defer></script>
    <script src="js/modules/todo.js" defer></script>
    <script src="js/modules/english.js" defer></script>
    <script src="js/modules/calligraphy.js" defer></script>
    <script src="js/modules/fitness.js" defer></script>
    <script src="js/modules/meal.js" defer></script>
    <script src="js/modules/savings.js" defer></script>
    <script src="js/modules/accounting.js" defer></script>
    <script src="js/modules/places.js" defer></script>
    <script src="js/modules/weekly.js" defer></script>
    <script src="js/modules/monthly.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
